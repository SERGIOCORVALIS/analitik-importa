[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analitik-importa"
version = "0.1.0"
description = "Agent for China→RU marketplace import niche analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "streamlit>=1.65",
    "pandas>=2.2",
    "altair>=5.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
analitik = "analitik_importa.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: live API calls (skipped without credentials)",
]
